name: Transport and extension checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.2'
      - run: python -m pip install .
      # Socket-pair fixtures only; never connect to a user's SketchUp model.
      - run: python -m unittest discover -s tests -v
      - name: Check Ruby syntax without executing the extension
        run: |
          ruby -c su_mcp/su_mcp.rb
          ruby -c su_mcp/su_mcp/main.rb
      - run: python scripts/package_extension.py
